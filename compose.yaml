services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mundo_viagens
      POSTGRES_USER: mundo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mundo -d mundo_viagens"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/mundo_viagens
      DB_USERNAME: mundo
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
