spring:
  application:
    name: mundo-viagens-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:mundo_viagens}
  flyway:
    enabled: true
    default-schema: ${DB_SCHEMA:mundo_viagens}
    schemas: ${DB_SCHEMA:mundo_viagens}
    create-schemas: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
app:
  jwt:
    secret: ${JWT_SECRET}
    ttl-seconds: ${JWT_TTL_SECONDS:3600}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:3000}
