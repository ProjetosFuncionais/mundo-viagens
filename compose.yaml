services:
  api:
    build: ./backend
    environment:
      DB_URL: ${DB_URL:?Defina a URL JDBC do Supabase no .env}
      DB_USERNAME: ${DB_USERNAME:?Defina o usuário do banco no .env}
      DB_PASSWORD: ${DB_PASSWORD:?Defina a senha do banco no .env}
      DB_SCHEMA: ${DB_SCHEMA:-mundo_viagens}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
