spring:
  application:
    name: mundo-viagens-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mundo_viagens}
    username: ${DB_USERNAME:mundo}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
app:
  jwt:
    secret: ${JWT_SECRET}
    ttl-seconds: ${JWT_TTL_SECONDS:3600}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:3000}
